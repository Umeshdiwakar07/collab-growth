<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Portfolio | Collab Growth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen text-gray-800 pb-16">

    <nav class="glass-nav border-b border-gray-200/60 shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="font-extrabold text-xl tracking-tight text-gray-900">Portfolio Settings</span>
            </div>
            <a href="/dashboard" class="text-gray-600 font-semibold hover:text-indigo-600 transition flex items-center gap-2">
                <span>←</span> Back to Dashboard
            </a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto mt-12 px-6">
        
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-12">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Update Your Profile</h2>
            <p class="text-gray-500 font-medium mb-8 border-b border-gray-100 pb-6">Make sure your details are up to date to attract the best brands.</p>

            <form action="/edit_profile" method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Your Niche / Specialty</label>
                        <input type="text" name="niche" value="{{ creator.niche }}" placeholder="e.g. Video Editing, Photography" required
                               class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Location</label>
                        <input type="text" name="location" value="{{ creator.location }}" placeholder="e.g. Mumbai, Remote" required
                               class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Starting Price (₹)</label>
                    <input type="number" name="base_price" value="{{ creator.base_price }}" placeholder="5000" required
                           class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">About Me (Bio)</label>
                    <textarea name="bio" rows="4" placeholder="Tell brands about your experience and what makes you unique..." required
                              class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all font-medium">{{ creator.bio }}</textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Instagram Link</label>
                        <input type="url" name="instagram_link" value="{{ creator.instagram_link }}" placeholder="https://instagram.com/..." 
                               class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-pink-400 transition-all font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Portfolio Link</label>
                        <input type="url" name="portfolio_link" value="{{ creator.portfolio_link }}" placeholder="https://behance.net/..." 
                               class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-900 transition-all font-medium">
                    </div>
                </div>

                <div class="pt-4">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Update Profile Picture</label>
                    <input type="file" name="profile_pic" accept="image/*"
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-all cursor-pointer border border-gray-200 rounded-xl bg-gray-50">
                </div>

                <div class="pt-6 border-t border-gray-100 mt-8">
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-extrabold py-4 rounded-xl hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-lg">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
