<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ business.name }} | Collab Growth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">Collab Growth</h1>
            <a href="/dashboard" class="text-gray-500 hover:text-blue-600 font-semibold transition">Back to Dashboard</a>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto p-8 bg-white rounded-2xl shadow-lg border border-gray-100 mb-10">
        
        <div class="flex items-center justify-between border-b border-gray-100 pb-6 mb-6">
            <div>
                <h2 class="text-4xl font-extrabold text-gray-900">{{ business.name }}</h2>
                <span class="inline-block mt-3 px-4 py-1.5 bg-blue-100 text-blue-800 text-sm font-bold rounded-full">
                    {{ business.company_type or 'Brand / Business' }}
                </span>
            </div>
            
            <button class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-md">
                Message Brand
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-6">
            
            <div class="bg-gray-50 p-5 rounded-xl border border-gray-100">
                <p class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-1">Location</p>
                <p class="text-lg font-semibold text-gray-800">{{ business.location or 'Not specified' }}</p>
            </div>

            <div class="bg-gray-50 p-5 rounded-xl border border-gray-100">
                <p class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-1">Working Hours</p>
                <p class="text-lg font-semibold text-gray-800">{{ business.working_hours or 'Not specified' }}</p>
            </div>

            <div class="bg-gray-50 p-5 rounded-xl border border-gray-100 md:col-span-2">
                <p class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-1">Business Contact</p>
                <a href="mailto:{{ business.email }}" class="text-lg font-semibold text-blue-600 hover:underline">
                    {{ business.email }}
                </a>
            </div>

        </div>
    </div>

</body>
</html>
