<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Profile Setup | Collab Growth</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-offline.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile_setup.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="h-8 w-auto rounded">
                <span class="font-bold text-xl text-gray-900">Collab Growth</span>
            </div>
            <a href="/dashboard" class="text-gray-600 font-bold hover:text-blue-600 transition">Cancel & Go Back</a>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto mt-12 px-6 pb-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 form-container">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Creator Profile</h1>
            <p class="text-gray-500 mb-8">Showcase your skills, set your rates, and get hired.</p>

            <form action="/profile" method="POST" enctype="multipart/form-data" id="creatorForm" class="space-y-6">
                
                <div class="flex flex-col items-center justify-center mb-6">
                    <div class="relative group cursor-pointer">
                        <img id="imagePreview" src="{{ url_for('static', filename='uploads/default.png') }}" alt="Profile Preview" 
                             class="w-32 h-32 rounded-full object-cover border-4 border-gray-100 shadow-sm transition-all">
                        <div class="absolute inset-0 bg-black bg-opacity-50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="text-white text-sm font-bold">Change Photo</span>
                        </div>
                        <input type="file" name="profile_pic" id="profile_pic" accept=".png, .jpg, .jpeg" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <p class="text-xs text-gray-500 mt-2">Click to upload a professional photo</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="input-group">
                        <label class="block text-gray-700 font-bold mb-2">Your Niche *</label>
                        <select name="niche" required class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none bg-white custom-input">
                            <option value="" disabled selected>Select your specialty...</option>
                            <option value="Video Editing">Video Editing</option>
                            <option value="Graphic Design">Graphic Design</option>
                            <option value="Content Writing">Content Writing</option>
                            <option value="Social Media Manager">Social Media Manager</option>
                            <option value="Photography">Photography</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="block text-gray-700 font-bold mb-2">Location *</label>
                        <input type="text" name="location" placeholder="e.g. Nashik, Pune" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none custom-input">
                    </div>
                </div>

                <div class="input-group">
                    <label class="block text-gray-700 font-bold mb-2">Base Rate (₹) *</label>
                    <input type="number" name="base_price" placeholder="e.g. 5000" required min="0"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none custom-input">
                </div>

                <div class="input-group">
                    <label class="block text-gray-700 font-bold mb-2">Instagram Link</label>
                    <input type="url" name="instagram_link" placeholder="https://instagram.com/yourusername" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none custom-input">
                </div>

                <div class="input-group">
                    <label class="block text-gray-700 font-bold mb-2">Portfolio / Drive Link</label>
                    <input type="url" name="portfolio_link" placeholder="https://yourwork.com" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none custom-input">
                </div>

                <div class="input-group">
                    <label class="block text-gray-700 font-bold mb-2">Your Bio *</label>
                    <textarea name="bio" id="bio" required rows="4" placeholder="Tell businesses about your experience, your style, and what you can do for them."
                              class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none resize-none custom-input"></textarea>
                </div>

                <p id="formError" class="text-red-600 text-sm font-bold hidden"></p>

                <div class="pt-4 border-t border-gray-100">
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition shadow-md submit-btn">
                        Save Creator Profile
                    </button>
                </div>
                
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/profile_setup.js') }}"></script>
</body>
</html>
