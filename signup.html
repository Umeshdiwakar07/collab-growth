<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Collab Growth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-offline.css') }}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-blue-800 to-gray-900 min-h-screen flex flex-col items-center justify-center p-6 relative overflow-x-hidden py-12">

    <div class="absolute top-0 left-0 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-0 right-0 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="flex justify-center mb-8">
            <a href="/" class="flex items-center gap-3 bg-white/10 px-6 py-3 rounded-2xl backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="h-8 w-auto brightness-0 invert" onerror="this.style.display='none';">
                <span class="font-extrabold text-2xl tracking-tight text-white">Collab Growth</span>
            </a>
        </div>

        <div class="glass-card rounded-3xl shadow-2xl border border-white/40 p-10">
            <h1 class="text-3xl font-extrabold text-gray-900 text-center mb-2">Join the Network</h1>
            <p class="text-gray-500 text-center mb-8 font-medium">Create your account to start collaborating.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 p-4 rounded-xl text-center font-medium text-sm {% if category == 'success' %}bg-teal-50 text-teal-700 border border-teal-100{% else %}bg-red-50 text-red-700 border border-red-100{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/signup" method="POST" class="space-y-5">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Full Name / Company Name</label>
                    <input type="text" name="name" required placeholder="Arjun or Nike"
                           class="w-full px-5 py-3.5 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-900 font-medium">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com"
                           class="w-full px-5 py-3.5 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-900 font-medium">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required placeholder="Create a strong password"
                           class="w-full px-5 py-3.5 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-900 font-medium">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">I am signing up as a...</label>
                    <div class="relative">
                        <select name="role" required class="w-full px-5 py-3.5 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-900 font-bold appearance-none cursor-pointer">
                            <option value="creator"> Content Creator</option>
                            <option value="business">Business / Brand</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-gray-700">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-extrabold py-4 px-4 rounded-xl hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 text-lg mt-6">
                    Create Account
                </button>
            </form>

            <p class="mt-8 text-center text-gray-600 font-medium">
                Already have an account? 
                <a href="/login" class="text-indigo-600 font-bold hover:text-indigo-800 transition-colors">Sign in</a>
            </p>
        </div>
    </div>

</body>
</html>
