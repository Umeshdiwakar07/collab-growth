<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Collab Growth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 p-8 md:p-10">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-sm border border-indigo-100">
                🔒
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Reset Password</h2>
            <p class="text-gray-500 font-medium">Enter your registered email address to set a new password.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-6 p-4 rounded-xl text-sm font-bold {% if category == 'danger' %}bg-red-50 text-red-600 border border-red-200{% else %}bg-green-50 text-green-600 border border-green-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/forgot_password" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Registered Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com"
                       class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">New Password</label>
                <input type="password" name="new_password" required placeholder="••••••••"
                       class="w-full px-5 py-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 transition-all font-medium">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-extrabold py-4 rounded-xl hover:shadow-lg transform hover:-translate-y-0.5 transition-all text-lg mt-4">
                Reset My Password
            </button>
        </form>

        <p class="text-center mt-8 text-gray-600 font-medium">
            Remembered your password? 
            <a href="/login" class="text-indigo-600 font-bold hover:underline">Log in here</a>
        </p>
    </div>

</body>
</html>
